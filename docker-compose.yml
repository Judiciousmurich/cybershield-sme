services:
  db:
    image: postgres:16
    container_name: cybershield-db
    environment:
      POSTGRES_DB: cybershield
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d cybershield']
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    container_name: cybershield-server
    ports:
      - '4000:4000'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/cybershield
      JWT_SECRET: ${JWT_SECRET:-change-me-in-local-env}
      JWT_EXPIRY: ${JWT_EXPIRY:-1h}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules

  client:
    build: ./client
    container_name: cybershield-client
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: http://server:4000
    depends_on:
      - server
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules

volumes:
  postgres_data:
  server_node_modules:
  client_node_modules:
