services:
  - type: web
    name: cybershield
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev --prefix client && npm run build --prefix client && npm ci --include=dev --prefix server && npm run build --prefix server
    startCommand: cd server && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cybershield-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: REPORT_ENCRYPTION_KEY
        generateValue: true

databases:
  - name: cybershield-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    databaseName: cybershield
    ipAllowList: []
